paths:
  train: data/raw/train.csv
  later: data/raw/later.csv
  holdout: data/raw/holdout_features.csv
  model: models/model.joblib
  predictions: predictions/holdout_predictions.csv
  findings: reports/findings.yaml
  data_report: reports/data_checks.json
  monitoring_report: reports/monitoring.json

data:
  target: loaves_sold
  leak_column: loaves_in_closing_register
  group_column: outlet
  text_column: day_type
  date_column: date
  numeric_features: [price_rs, temp_c, footfall_index, competitor_shops, shelf_hours, orders_previous_day]
  categorical_features: [day_type, outlet]
  true_day_types: [weekday, weekend, festival]
  stuck_column: shelf_hours
  stuck_min_run_days: 5

mlflow:
  tracking_uri: sqlite:///mlflow.db
  artifact_location: mlartifacts
  experiment_name: mp275-bread-sales
  registered_model_name: mp275-bread-model
  alias: champion

training:
  random_state: 42
  validation_fraction: 0.2
  # three or more settings are tried; the best (lowest validation MAE) becomes v1
  candidates:
    - {name: ridge, model: ridge, alpha: 1.0}
    - {name: random_forest, model: random_forest, n_estimators: 200, max_depth: 12, min_samples_leaf: 2}
    - {name: gradient_boosting, model: gradient_boosting, n_estimators: 300, learning_rate: 0.05, max_depth: 3}

monitoring:
  psi_bins: 10
  retrain_fraction: 0.70
  promote_min_improvement: 0.05
  recent_weight_grid: [1, 3, 5, 10, 20, 50]
